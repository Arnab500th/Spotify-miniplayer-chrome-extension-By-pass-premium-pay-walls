<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Float — PiP Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="icon" type="image/x-icon" href="/icons/icon128.svg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d12;
      --bg2: #161620;
      --bg3: #1e1e2a;
      --bgh: #252533;
      --ac: #1db954;
      --acd: rgba(29,185,84,0.15);
      --acg: rgba(29,185,84,0.3);
      --t1: #fff;
      --t2: #9898b0;
      --t3: #55556a;
      --br: rgba(255,255,255,0.07);
      --r: 0px;
      --ea: 0.18s cubic-bezier(0.4,0,0.2,1);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--t1);
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #player {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* ── Title bar (draggable) ─────────────────────────────── */
    #titlebar {
      padding: 10px 14px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 22px;
      height: 22px;
      background: var(--ac);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      box-shadow: 0 2px 8px var(--acg);
    }

    .brand-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--t2);
      letter-spacing: 0.04em;
    }

    .pin-btn {
      -webkit-app-region: no-drag;
      border: none;
      background: transparent;
      color: var(--t3);
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--ea);
      font-size: 12px;
    }

    .pin-btn:hover { background: var(--bg3); color: var(--t2); }
    .pin-btn.on { color: var(--ac); }

    /* ── Album art ──────────────────────────────────────────── */
    #art-wrap {
      padding: 0 14px 10px;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .art-inner {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg3);
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
    }

    #art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.35s ease;
    }

    #art.fade { opacity: 0; }

    .art-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.5));
      pointer-events: none;
    }

    /* ── Track info ─────────────────────────────────────────── */
    #track-info {
      padding: 0 14px 4px;
      overflow: hidden;
      min-width: 0;
    }

    .track-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--t1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      letter-spacing: -0.015em;
    }

    .track-artist {
      font-size: 11px;
      color: var(--t2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .scroll {
      display: inline-block;
      animation: mar 9s linear infinite;
      padding-right: 40px;
    }

    @keyframes mar {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ── Progress bar ──────────────────────────────────────── */
    #progress-wrap {
      padding: 0 14px 2px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .time-label {
      font-size: 10px;
      color: var(--t3);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: var(--bg3);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
      transition: height var(--ea);
    }

    .progress-track:hover { height: 5px; }

    .progress-fill {
      height: 100%;
      background: var(--ac);
      border-radius: 3px;
      pointer-events: none;
      position: relative;
      transition: width 0.4s linear;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px var(--acg);
      transition: transform var(--ea);
    }

    .progress-track:hover .progress-fill::after {
      transform: translateY(-50%) scale(1);
    }

    /* ── Controls ───────────────────────────────────────────── */
    #controls {
      padding: 2px 14px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ctrl-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--ea), background var(--ea), color var(--ea), box-shadow var(--ea);
      color: var(--t2);
      flex-shrink: 0;
      position: relative;
    }

    .ctrl-btn:hover { color: var(--t1); transform: scale(1.1); background: var(--bg3); }
    .ctrl-btn:active { transform: scale(0.94); }
    .ctrl-btn.sm { width: 32px; height: 32px; font-size: 14px; }
    .ctrl-btn.lg {
      width: 44px;
      height: 44px;
      font-size: 17px;
      background: var(--ac);
      color: #000;
      box-shadow: 0 4px 16px var(--acg);
    }
    .ctrl-btn.lg:hover {
      background: #22d460;
      color: #000;
      transform: scale(1.08);
      box-shadow: 0 6px 22px var(--acg);
    }
    .ctrl-btn.on { color: var(--ac); }

    .rep-badge {
      position: absolute;
      font-size: 7px;
      font-weight: 700;
      color: var(--ac);
      bottom: 2px;
      right: 2px;
      pointer-events: none;
      display: none;
    }
    .ctrl-btn.on .rep-badge { display: block; }

    .tooltip {
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg3);
      color: var(--t2);
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
      border: 1px solid var(--br);
      z-index: 200;
    }

    .ctrl-btn:hover .tooltip { opacity: 1; }

    /* ── Volume ─────────────────────────────────────────────── */
    #volume-wrap {
      padding: 0 14px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vol-icon {
      font-size: 13px;
      cursor: pointer;
      color: var(--t3);
      transition: color var(--ea);
      background: none;
      border: none;
      padding: 0;
    }

    .vol-icon:hover { color: var(--t2); }

    .vol-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      background: var(--bg3);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--ac);
      cursor: pointer;
    }

    /* ── Track change animation ────────────────────────────── */
    @keyframes trackChange {
      0% { opacity: 1; transform: translateX(0); }
      35% { opacity: 0; transform: translateX(-10px); }
      65% { opacity: 0; transform: translateX(10px); }
      100% { opacity: 1; transform: none; }
    }

    .track-anim { animation: trackChange 0.35s ease; }

    /* ── No Spotify message ────────────────────────────────── */
    #no-spotify {
      display: none;
      flex: 1;
      padding: 40px 20px;
      text-align: center;
      color: var(--t3);
      font-size: 13px;
      line-height: 1.6;
    }

    #no-spotify .emoji {
      font-size: 36px;
      margin-bottom: 12px;
    }

    #no-spotify .msg {
      color: var(--t2);
      font-size: 12px;
    }

    /* ── Responsive Hiding ───────────────────────────────────── */
    @media (max-height: 250px) {
      #art-wrap { display: none !important; }
    }

    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="player">
    <div id="titlebar">
      <div class="brand">
        <div class="logo">🎵</div>
        <span class="brand-name">SPOTIFY FLOAT</span>
      </div>
    </div>

    <div id="art-wrap">
      <div class="art-inner">
        <img id="art" src="" alt="" draggable="false" />
        <div class="art-gradient"></div>
      </div>
    </div>

    <div id="track-info">
      <div class="track-title" id="track-title">Waiting for track…</div>
      <div class="track-artist" id="track-artist">—</div>
    </div>

    <div id="progress-wrap">
      <div class="time-row">
        <span class="time-label" id="time-cur">0:00</span>
        <span class="time-label" id="time-tot">0:00</span>
      </div>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <div id="controls">
      <button class="ctrl-btn sm" id="c-shuf" aria-label="Shuffle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><polyline points="16 21 21 21 21 16"/><line x1="4" y1="20" x2="21" y2="3"/><line x1="21" y1="21" x2="14" y2="14"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        <span class="tooltip">Shuffle</span>
      </button>
      <button class="ctrl-btn sm" id="c-prev" aria-label="Previous">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.2"/></svg>
        <span class="tooltip">Previous</span>
      </button>
      <button class="ctrl-btn lg" id="c-play" aria-label="Play/Pause">
        <svg id="i-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="i-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <span class="tooltip">Play / Pause</span>
      </button>
      <button class="ctrl-btn sm" id="c-next" aria-label="Next">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.2"/></svg>
        <span class="tooltip">Next</span>
      </button>
      <button class="ctrl-btn sm" id="c-rep" aria-label="Repeat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span class="rep-badge" id="rep-badge"></span>
        <span class="tooltip">Repeat</span>
      </button>
    </div>

    <div id="volume-wrap">
      <button class="vol-icon" id="vol-icon">🔊</button>
      <input type="range" class="vol-slider" id="vol-slider" min="0" max="100" value="100" />
    </div>

    <div id="no-spotify">
      <div class="emoji">🎵</div>
      <div class="msg">Open <strong>Spotify Web</strong> and play a song<br/>to see it here.</div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
