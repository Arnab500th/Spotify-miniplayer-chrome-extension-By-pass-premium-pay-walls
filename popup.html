<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Float</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0f;
      --bg2:     #13131a;
      --bg3:     #1c1c26;
      --accent:  #1db954;
      --accent2: #1ed760;
      --text:    #ffffff;
      --muted:   #a0a0b8;
      --border:  rgba(255,255,255,0.07);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      width: 240px;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(29,185,84,0.35);
    }

    .brand {
      flex: 1;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .body {
      padding: 14px 18px;
    }

    .toggle-btn {
      width: 100%;
      padding: 11px 0;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #000;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 14px rgba(29,185,84,0.3);
    }

    .toggle-btn:hover { background: var(--accent2); transform: translateY(-1px); }
    .toggle-btn:active { transform: translateY(0); }

    .toggle-btn.hide-mode {
      background: var(--bg3);
      color: var(--muted);
      box-shadow: none;
    }

    .pip-btn {
      width: 100%;
      padding: 9px 0;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: transparent;
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.01em;
      margin-top: 8px;
    }

    .pip-btn:hover {
      background: var(--accent);
      color: #000;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(29,185,84,0.3);
    }

    .pip-btn:active { transform: translateY(0); }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bg3);
      transition: background 0.3s ease;
      flex-shrink: 0;
    }

    .status-dot.active {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(29,185,84,0.6);
    }

    .status-text {
      font-size: 11px;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .shortcut-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .shortcut-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shortcut-label {
      font-size: 11px;
      color: var(--muted);
    }

    .kbd-group {
      display: flex;
      gap: 3px;
    }

    kbd {
      font-family: inherit;
      font-size: 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 5px;
      color: var(--text);
    }

    footer {
      padding: 10px 18px 14px;
      border-top: 1px solid var(--border);
    }

    .open-spotify-btn {
      width: 100%;
      padding: 8px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .open-spotify-btn:hover {
      background: var(--bg2);
      color: var(--text);
      border-color: var(--accent);
    }

    #no-spotify {
      display: none;
      background: rgba(255, 90, 90, 0.1);
      border: 1px solid rgba(255,90,90,0.2);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      color: #ff8080;
      line-height: 1.5;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎵</div>
    <div class="brand">
      <div class="brand-name">Spotify Float</div>
      <div class="brand-sub">Mini Player</div>
    </div>
  </header>

  <div class="body">
    <div id="no-spotify">
      Open <strong>open.spotify.com</strong> first, then toggle the player.
    </div>

    <button class="toggle-btn" id="toggle-btn">Show Mini Player</button>
    <button class="pip-btn" id="pip-btn">⬛ Open PiP Player</button>

    <div class="status-row">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Not active</span>
    </div>

    <div class="divider"></div>

    <div class="shortcut-list">
      <div class="shortcut-row">
        <span class="shortcut-label">Play / Pause</span>
        <div class="kbd-group"><kbd>Space</kbd></div>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-label">Next Track</span>
        <div class="kbd-group"><kbd>Ctrl</kbd><kbd>→</kbd></div>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-label">Previous Track</span>
        <div class="kbd-group"><kbd>Ctrl</kbd><kbd>←</kbd></div>
      </div>
    </div>
  </div>

  <footer>
    <button class="open-spotify-btn" id="open-spotify">Open Spotify Web</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
