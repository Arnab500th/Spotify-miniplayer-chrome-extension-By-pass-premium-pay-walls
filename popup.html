<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Miniplayer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #080810;
      --glass:      rgba(255,255,255,0.04);
      --glass-mid:  rgba(255,255,255,0.055);
      --glass-hi:   rgba(255,255,255,0.09);
      --border:     rgba(255,255,255,0.08);
      --border-hi:  rgba(255,255,255,0.14);
      --ac:         #1db954;
      --ac2:        #1ed760;
      --ac-dim:     rgba(29,185,84,0.12);
      --ac-glow:    rgba(29,185,84,0.35);
      --text:       #f0f0f8;
      --muted:      #7878a0;
      --muted2:     #a0a0c0;
      --ease:       0.18s cubic-bezier(0.4,0,0.2,1);
    }

    html, body {
      width: 248px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse 160px 120px at 10% -10%, rgba(29,185,84,0.16) 0%, transparent 70%),
        radial-gradient(ellipse 120px 100px at 90% 110%, rgba(29,185,84,0.09) 0%, transparent 70%),
        #080810;
    }

    header {
      padding: 15px 16px 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(29,185,84,0.3) 50%, transparent);
    }

    .logo-wrap { position: relative; flex-shrink: 0; }

    .logo {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #1db954 0%, #0fa843 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      box-shadow: 0 4px 16px rgba(29,185,84,0.45), 0 0 0 1px rgba(29,185,84,0.2);
    }

    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 13px;
      border: 1px solid rgba(29,185,84,0.25);
      animation: ring-pulse 3s ease-in-out infinite;
    }

    @keyframes ring-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%       { opacity: 0.9; transform: scale(1.04); }
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .brand-sub {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .body {
      padding: 13px 14px 14px;
    }

    #no-spotify {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,80,80,0.07);
      border: 1px solid rgba(255,80,80,0.18);
      font-size: 11px;
      color: #ff9090;
      line-height: 1.55;
      margin-bottom: 11px;
    }

    #no-spotify strong { color: #ffaaaa; font-weight: 600; }

    .toggle-btn {
      width: 100%;
      padding: 11px 0;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #1db954 0%, #17a348 100%);
      color: #000;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 3px 16px rgba(29,185,84,0.38), inset 0 1px 0 rgba(255,255,255,0.2);
      transition: transform var(--ease), box-shadow var(--ease), background var(--ease);
      position: relative;
      overflow: hidden;
    }

    .toggle-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .toggle-btn:hover {
      background: linear-gradient(135deg, #1ed760 0%, #19b84f 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(29,185,84,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .toggle-btn:active { transform: translateY(0px); box-shadow: 0 2px 10px rgba(29,185,84,0.3); }

    .toggle-btn.hide-mode {
      background: var(--glass-mid);
      color: var(--muted2);
      box-shadow: none;
      border: 1px solid var(--border);
    }
    .toggle-btn.hide-mode::after { display: none; }
    .toggle-btn.hide-mode:hover { background: var(--glass-hi); color: var(--text); }

    .pip-btn {
      width: 100%;
      padding: 9px 0;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid rgba(29,185,84,0.28);
      background: rgba(29,185,84,0.07);
      color: var(--ac);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: all var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .pip-btn:hover {
      background: linear-gradient(135deg, #1db954 0%, #17a348 100%);
      color: #000;
      border-color: transparent;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(29,185,84,0.35);
    }

    .pip-btn:active { transform: translateY(0); }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      padding: 0 2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      flex-shrink: 0;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    .status-dot.active {
      background: var(--ac);
      box-shadow: 0 0 7px var(--ac-glow);
      animation: dot-blink 2.5s ease-in-out infinite;
    }

    @keyframes dot-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }

    .status-text { font-size: 11px; color: var(--muted); }

    .divider {
      height: 1px;
      margin: 12px 0;
      background: linear-gradient(90deg, transparent, var(--border-hi) 30%, var(--border-hi) 70%, transparent);
    }

    .section-label {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      padding: 0 1px;
    }

    .shortcut-list { display: flex; flex-direction: column; gap: 5px; }

    .shortcut-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 9px;
      border-radius: 8px;
      background: var(--glass);
      border: 1px solid transparent;
      transition: background var(--ease), border-color var(--ease);
    }

    .shortcut-row:hover { background: var(--glass-mid); border-color: var(--border); }

    .shortcut-label { font-size: 11.5px; color: var(--muted2); }

    .kbd-group { display: flex; gap: 3px; align-items: center; }

    kbd {
      font-family: 'DM Sans', monospace;
      font-size: 10px;
      font-weight: 500;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 2px 6px;
      color: rgba(255,255,255,0.65);
      line-height: 1.4;
    }

    footer {
      padding: 10px 14px 13px;
      border-top: 1px solid var(--border);
    }

    .open-spotify-btn {
      width: 100%;
      padding: 8px 0;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11.5px;
      cursor: pointer;
      transition: all var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .open-spotify-btn:hover {
      background: var(--glass-mid);
      color: var(--text);
      border-color: rgba(29,185,84,0.3);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <div class="logo">🎵</div>
    </div>
    <div>
      <div class="brand-name">Spotify Float</div>
      <div class="brand-sub">Mini Player · v1.5.0</div>
    </div>
  </header>

  <div class="body">
    <div id="no-spotify">
      Open <strong>open.spotify.com</strong> in a tab first, then toggle the player.
    </div>

    <button class="toggle-btn" id="toggle-btn">Show Mini Player</button>

    <button class="pip-btn" id="pip-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="11" width="8" height="6"/>
      </svg>
      Open Picture-in-Picture
    </button>

    <div class="status-row">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Not active</span>
    </div>

    <div class="divider"></div>

    <div class="section-label">Keyboard shortcuts</div>

    <div class="shortcut-list">
      <div class="shortcut-row">
        <span class="shortcut-label">Play / Pause</span>
        <div class="kbd-group"><kbd>Space</kbd></div>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-label">Next track</span>
        <div class="kbd-group"><kbd>Ctrl</kbd><kbd>→</kbd></div>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-label">Previous track</span>
        <div class="kbd-group"><kbd>Ctrl</kbd><kbd>←</kbd></div>
      </div>
    </div>
  </div>

  <footer>
    <a href="https://open.spotify.com/playlist/1av3P3oZmqBfesj2SqAWfC" class="button-link">
    <button class="open-spotify-btn" id="open-spotify" >
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      Open Spotify Web
    </button></a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
